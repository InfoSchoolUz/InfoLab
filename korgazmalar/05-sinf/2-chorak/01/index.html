<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tasvirlar bilan ishlash</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050a10;color:#e2e8f0;font-family:'Inter',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
canvas#bg{position:fixed;inset:0;z-index:0}
.ui{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;padding:10px 14px}

.hdr{text-align:center;margin-bottom:8px}
.hdr-badge{font-size:8px;color:#ec489955;letter-spacing:4px}
.hdr h1{font-size:1.2rem;font-weight:800;color:#fff;text-shadow:0 0 20px #ec489944}
.hdr p{font-size:.73rem;color:#475569}

.main{flex:1;display:grid;grid-template-columns:1.3fr 1fr;gap:10px;min-height:0}

/* Paint simulation */
.paint-panel{background:rgba(5,8,16,.9);border:1px solid #1e2a3a;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.panel-title{font-size:8px;letter-spacing:3px;font-weight:700;padding:9px 13px 5px}
.pt-pink{color:#ec4899}
.pt-blue{color:#3b82f6}

/* Paint chrome */
.paint-chrome{flex:1;display:flex;flex-direction:column;margin:0 10px 10px;border-radius:10px;overflow:hidden;border:1px solid #1e2a3a}
.paint-titlebar{background:#1a1a2e;padding:5px 10px;display:flex;align-items:center;gap:6px}
.pt-dots{display:flex;gap:3px}
.pt-dot{width:7px;height:7px;border-radius:50%}
.pt-name{flex:1;text-align:center;font-size:.7rem;color:#64748b;font-family:'JetBrains Mono',monospace}

/* Menu bar */
.menu-bar{background:#252540;padding:4px 10px;display:flex;gap:2px;border-bottom:1px solid #1e2a3a}
.menu-item{padding:3px 10px;font-size:.68rem;color:#94a3b8;cursor:pointer;border-radius:4px;transition:all .2s}
.menu-item:hover,.menu-item.active{background:rgba(236,72,153,.15);color:#f9a8d4}

/* Toolbar */
.toolbar{background:#1e1e38;padding:6px;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid #1e2a3a}
.tool{width:32px;height:32px;border-radius:6px;border:1.5px solid #2a2a4a;background:rgba(10,10,30,.6);
  display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all .2s}
.tool:hover{border-color:#ec489944;background:rgba(236,72,153,.08)}
.tool.active{border-color:#ec4899;background:rgba(236,72,153,.15);box-shadow:0 0 10px rgba(236,72,153,.3)}
.tool-tip{font-size:.6rem;color:#475569;padding:2px 6px;border-radius:4px;background:rgba(10,10,30,.8);
  white-space:nowrap;display:none;position:absolute;z-index:10;border:1px solid #1e2a3a}

/* Canvas area */
.canvas-wrap{flex:1;background:#fff;position:relative;overflow:hidden}
canvas#paintCanvas{position:absolute;inset:0;cursor:crosshair}

/* Status */
.paint-status{background:#1a1a2e;padding:3px 10px;font-size:.62rem;color:#475569;
  font-family:'JetBrains Mono',monospace;display:flex;gap:12px}

/* Right */
.right{display:flex;flex-direction:column;gap:8px;min-height:0}

/* Steps */
.steps-panel{background:rgba(5,8,16,.9);border:1px solid #1e2a3a;border-radius:14px;
  padding:12px;flex:1;overflow:hidden;display:flex;flex-direction:column}
.steps-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.step-item{display:flex;gap:8px;padding:8px 10px;border-radius:9px;
  background:rgba(8,8,20,.7);border:1px solid #1e2a3a;opacity:.3;transition:all .4s;cursor:pointer}
.step-item:hover{opacity:.7}
.step-item.active{opacity:1;border-color:#ec4899;background:rgba(236,72,153,.07);animation:slideIn .4s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.si-icon{font-size:1rem;flex-shrink:0}
.si-body{flex:1}
.si-title{font-size:.78rem;font-weight:700;color:#e2e8f0;margin-bottom:2px}
.si-desc{font-size:.67rem;color:#64748b;line-height:1.4}

/* Color palette */
.palette-panel{background:rgba(5,8,16,.9);border:1px solid #1e2a3a;border-radius:14px;padding:10px}
.palette-grid{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.color-swatch{width:22px;height:22px;border-radius:5px;cursor:pointer;border:2px solid transparent;
  transition:all .2s}
.color-swatch:hover{transform:scale(1.2);border-color:#fff4}
.color-swatch.selected{border-color:#fff;transform:scale(1.15);box-shadow:0 0 8px rgba(255,255,255,.4)}
.cur-color{width:32px;height:32px;border-radius:8px;border:2px solid #fff4;margin-left:auto}

/* Actions */
.actions-panel{background:rgba(5,8,16,.9);border:1px solid #1e2a3a;border-radius:14px;padding:10px}
.act-row{display:flex;gap:6px;margin-top:6px}
.act-btn{flex:1;padding:7px;border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer;
  font-family:'Inter',sans-serif;transition:all .2s;border:1.5px solid}
.ab-open{background:rgba(59,130,246,.1);border-color:#3b82f644;color:#60a5fa}
.ab-open:hover{background:rgba(59,130,246,.2)}
.ab-new{background:rgba(34,197,94,.1);border-color:#22c55e44;color:#4ade80}
.ab-new:hover{background:rgba(34,197,94,.2)}
.ab-save{background:rgba(236,72,153,.1);border-color:#ec489944;color:#f9a8d4}
.ab-save:hover{background:rgba(236,72,153,.2)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="ui">
  <div class="hdr">
    <div class="hdr-badge">&#9679; 5-SINF &middot; 2-CHORAK &middot; 1-MAVZU</div>
    <h1>&#127912; Tasvirlar bilan Ishlashni Boshlash</h1>
    <p>Microsoft Paint — rasmlar yaratish va tahrirlash dasturi</p>
  </div>

  <div class="main">
    <div class="paint-panel">
      <div class="panel-title pt-pink">&#127912; PAINT DASTURI &mdash; CHIZING!</div>
      <div class="paint-chrome">
        <div class="paint-titlebar">
          <div class="pt-dots">
            <div class="pt-dot" style="background:#ef4444"></div>
            <div class="pt-dot" style="background:#f59e0b"></div>
            <div class="pt-dot" style="background:#22c55e"></div>
          </div>
          <div class="pt-name">Nomi yo'q — Paint</div>
        </div>
        <div class="menu-bar">
          <div class="menu-item" onclick="menuAction('file')">Fayl</div>
          <div class="menu-item" onclick="menuAction('edit')">Tahrirlash</div>
          <div class="menu-item" onclick="menuAction('view')">Ko'rinish</div>
          <div class="menu-item" onclick="menuAction('image')">Tasvir</div>
        </div>
        <div class="toolbar" id="toolbar">
          <div class="tool active" id="t-pencil" onclick="setTool('pencil')" title="Qalam">&#9998;</div>
          <div class="tool" id="t-brush" onclick="setTool('brush')" title="Mo'yqalam">&#128396;</div>
          <div class="tool" id="t-eraser" onclick="setTool('eraser')" title="O'chirg'ich">&#9999;</div>
          <div class="tool" id="t-fill" onclick="setTool('fill')" title="To'ldirish">&#127798;</div>
          <div class="tool" id="t-line" onclick="setTool('line')" title="Chiziq">&#9135;</div>
          <div class="tool" id="t-rect" onclick="setTool('rect')" title="To'rtburchak">&#9645;</div>
          <div class="tool" id="t-circle" onclick="setTool('circle')" title="Doira">&#9711;</div>
          <div class="tool" id="t-text" onclick="setTool('text')" title="Matn">T</div>
          <div class="tool" id="t-clear" onclick="clearCanvas()" title="Tozalash" style="margin-left:auto">&#128465;</div>
        </div>
        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="paintCanvas"></canvas>
        </div>
        <div class="paint-status">
          <span id="st-tool">Uskuna: Qalam</span>
          <span id="st-pos">X:0 Y:0</span>
          <span id="st-size">100%</span>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="steps-panel">
        <div class="panel-title pt-pink" style="margin-bottom:8px">&#9889; PAINT ASOSLARI</div>
        <div class="steps-list" id="steps-list"></div>
      </div>

      <div class="palette-panel">
        <div class="panel-title pt-blue">&#127912; RANG PALITASI</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
          <div class="palette-grid" id="palette"></div>
          <div class="cur-color" id="cur-color" style="background:#000000"></div>
        </div>
      </div>

      <div class="actions-panel">
        <div class="panel-title pt-pink">&#128196; ASOSIY AMALLAR</div>
        <div class="act-row">
          <button class="act-btn ab-open" onclick="openFile()">&#128193; Ochish</button>
          <button class="act-btn ab-new" onclick="newFile()">&#43; Yangi</button>
          <button class="act-btn ab-save" onclick="saveFile()">&#128190; Saqlash</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Background
var bgc=document.getElementById('bg'),bx=bgc.getContext('2d'),bPts=[];
function rBg(){bgc.width=innerWidth;bgc.height=innerHeight;}rBg();window.addEventListener('resize',rBg);
for(var i=0;i<40;i++) bPts.push({x:Math.random()*1400,y:Math.random()*900,vx:(Math.random()-.5)*.09,vy:(Math.random()-.5)*.09});
(function ab(){requestAnimationFrame(ab);bx.clearRect(0,0,bgc.width,bgc.height);
  bPts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=bgc.width;if(p.x>bgc.width)p.x=0;
    if(p.y<0)p.y=bgc.height;if(p.y>bgc.height)p.y=0;});
  for(var i=0;i<bPts.length;i++) for(var j=i+1;j<bPts.length;j++){
    var d=Math.hypot(bPts[i].x-bPts[j].x,bPts[i].y-bPts[j].y);
    if(d<90){bx.beginPath();bx.moveTo(bPts[i].x,bPts[i].y);bx.lineTo(bPts[j].x,bPts[j].y);
      bx.strokeStyle='rgba(236,72,153,'+(0.02*(1-d/90))+')';bx.stroke();}}
  bPts.forEach(function(p){bx.beginPath();bx.arc(p.x,p.y,1.2,0,Math.PI*2);bx.fillStyle='rgba(236,72,153,.1)';bx.fill();});
})();

// Paint canvas
var pc=document.getElementById('paintCanvas');
var ctx=pc.getContext('2d');
var wrap=document.getElementById('canvas-wrap');

function resizeCanvas(){
  var old=document.createElement('canvas');
  old.width=pc.width;old.height=pc.height;
  old.getContext('2d').drawImage(pc,0,0);
  pc.width=wrap.clientWidth;pc.height=wrap.clientHeight;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,pc.width,pc.height);
  ctx.drawImage(old,0,0);
}
setTimeout(resizeCanvas,100);
window.addEventListener('resize',resizeCanvas);

var tool='pencil',color='#000000',drawing=false;
var lastX=0,lastY=0,startX=0,startY=0;
var snapshot=null;

var COLORS=['#000000','#ffffff','#ef4444','#f97316','#f59e0b','#22c55e',
  '#06b6d4','#3b82f6','#8b5cf6','#ec4899','#84cc16','#14b8a6',
  '#f43f5e','#a855f7','#0ea5e9','#78716c'];

function buildPalette(){
  var pal=document.getElementById('palette');pal.innerHTML='';
  COLORS.forEach(function(c){
    var d=document.createElement('div');d.className='color-swatch'+(c===color?' selected':'');
    d.style.background=c;
    d.onclick=function(){color=c;document.getElementById('cur-color').style.background=c;
      document.querySelectorAll('.color-swatch').forEach(function(s){s.classList.remove('selected');});
      d.classList.add('selected');};
    pal.appendChild(d);
  });
}

function setTool(t){
  tool=t;
  document.querySelectorAll('.tool').forEach(function(el){el.classList.remove('active');});
  var el=document.getElementById('t-'+t);if(el)el.classList.add('active');
  var names={pencil:'Qalam',brush:'Mo\'yqalam',eraser:'O\'chirg\'ich',
    fill:'To\'ldirish',line:'Chiziq',rect:'To\'rtburchak',circle:'Doira',text:'Matn'};
  document.getElementById('st-tool').textContent='Uskuna: '+(names[t]||t);
  activateStep(t);
}

var STEPS=[
  {id:'pencil',icon:'&#9998;',title:'Qalam (Pencil)',desc:'Asosiy chizish vositasi. Sichqoncha bilan ushlab suring — chiziq chiqadi.'},
  {id:'brush',icon:'&#128396;',title:'Mo\'yqalam (Brush)',desc:'Qalin chiziq chizadi. Har xil o\'lcham va shakllarda mavjud.'},
  {id:'eraser',icon:'&#9999;',title:'O\'chirg\'ich (Eraser)',desc:'Chizgan narsalarni o\'chiradi. Katta o\'lcham — katta o\'chiriladi.'},
  {id:'fill',icon:'&#127798;',title:'To\'ldirish (Fill)',desc:'Yopiq sohani tanlangan rang bilan to\'ldiradi. "Chelak" deb ham ataladi.'},
  {id:'line',icon:'&#9135;',title:'Chiziq (Line)',desc:'Tekis to\'g\'ri chiziq chizadi. Bosib suring — chiziq uzayadi.'},
  {id:'rect',icon:'&#9645;',title:'To\'rtburchak (Rectangle)',desc:'To\'rtburchak shakl chizadi. Shift bosib — kvadrat chiziladi.'},
  {id:'circle',icon:'&#9711;',title:'Doira (Ellipse)',desc:'Oval yoki doira chizadi. Shift bosib — aniq doira chiziladi.'},
  {id:'open',icon:'&#128193;',title:'Tasvir Ochish',desc:'Fayl → Ochish yoki Ctrl+O. Diskdan rasm faylini ochadi.'},
  {id:'save',icon:'&#128190;',title:'Tasvir Saqlash',desc:'Ctrl+S — tasvirni saqlaydi. Format: .png, .jpg, .bmp, .gif'},
];

function buildSteps(){
  var list=document.getElementById('steps-list');list.innerHTML='';
  STEPS.forEach(function(s){
    var d=document.createElement('div');d.className='step-item';d.id='si-'+s.id;
    d.innerHTML='<div class="si-icon">'+s.icon+'</div>'
      +'<div class="si-body"><div class="si-title">'+s.title+'</div>'
      +'<div class="si-desc">'+s.desc+'</div></div>';
    d.onclick=function(){setTool(s.id);};
    list.appendChild(d);
  });
}

function activateStep(id){
  document.querySelectorAll('.step-item').forEach(function(el){el.classList.remove('active');});
  var el=document.getElementById('si-'+id);if(el)el.classList.add('active');
}

// Drawing
function getPos(e){
  var r=pc.getBoundingClientRect();
  var src=e.touches?e.touches[0]:e;
  return{x:src.clientX-r.left,y:src.clientY-r.top};
}

function startDraw(e){
  e.preventDefault();
  var p=getPos(e);lastX=p.x;lastY=p.y;startX=p.x;startY=p.y;
  drawing=true;
  snapshot=ctx.getImageData(0,0,pc.width,pc.height);
  if(tool==='fill'){floodFill(Math.round(p.x),Math.round(p.y));drawing=false;return;}
  ctx.beginPath();ctx.moveTo(p.x,p.y);
  ctx.strokeStyle=tool==='eraser'?'#ffffff':color;
  ctx.lineWidth=tool==='eraser'?20:tool==='brush'?8:2;
  ctx.lineCap='round';ctx.lineJoin='round';
}

function draw(e){
  e.preventDefault();
  if(!drawing)return;
  var p=getPos(e);
  document.getElementById('st-pos').textContent='X:'+Math.round(p.x)+' Y:'+Math.round(p.y);
  if(tool==='pencil'||tool==='brush'||tool==='eraser'){
    ctx.lineTo(p.x,p.y);ctx.stroke();
    lastX=p.x;lastY=p.y;
  } else {
    ctx.putImageData(snapshot,0,0);
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();
    if(tool==='line'){ctx.moveTo(startX,startY);ctx.lineTo(p.x,p.y);ctx.stroke();}
    else if(tool==='rect'){ctx.strokeRect(startX,startY,p.x-startX,p.y-startY);}
    else if(tool==='circle'){
      var rx=(p.x-startX)/2,ry=(p.y-startY)/2;
      ctx.ellipse(startX+rx,startY+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);ctx.stroke();
    }
  }
}

function endDraw(e){drawing=false;ctx.beginPath();}

function floodFill(x,y){
  var imgData=ctx.getImageData(0,0,pc.width,pc.height);
  var data=imgData.data;
  var idx=(y*pc.width+x)*4;
  var tr=data[idx],tg=data[idx+1],tb=data[idx+2];
  var fc=hexToRgb(color);
  if(tr===fc.r&&tg===fc.g&&tb===fc.b)return;
  var stack=[[x,y]];
  while(stack.length){
    var px=stack.pop();var cx2=px[0],cy2=px[1];
    if(cx2<0||cy2<0||cx2>=pc.width||cy2>=pc.height)continue;
    var i=(cy2*pc.width+cx2)*4;
    if(data[i]!==tr||data[i+1]!==tg||data[i+2]!==tb)continue;
    data[i]=fc.r;data[i+1]=fc.g;data[i+2]=fc.b;data[i+3]=255;
    stack.push([cx2+1,cy2],[cx2-1,cy2],[cx2,cy2+1],[cx2,cy2-1]);
  }
  ctx.putImageData(imgData,0,0);
}

function hexToRgb(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return{r:r,g:g,b:b};
}

pc.addEventListener('mousedown',startDraw);
pc.addEventListener('mousemove',draw);
pc.addEventListener('mouseup',endDraw);
pc.addEventListener('touchstart',startDraw,{passive:false});
pc.addEventListener('touchmove',draw,{passive:false});
pc.addEventListener('touchend',endDraw);

function clearCanvas(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,pc.width,pc.height);
}
function newFile(){clearCanvas();document.querySelector('.pt-name').textContent='Yangi tasvir — Paint';}
function openFile(){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      var img=new Image();img.onload=function(){
        ctx.fillStyle='#fff';ctx.fillRect(0,0,pc.width,pc.height);
        ctx.drawImage(img,0,0,Math.min(img.width,pc.width),Math.min(img.height,pc.height));
      };img.src=ev.target.result;
    };reader.readAsDataURL(file);
    document.querySelector('.pt-name').textContent=file.name+' — Paint';
  };inp.click();
}
function saveFile(){
  var a=document.createElement('a');
  a.download='tasvir.png';a.href=pc.toDataURL('image/png');a.click();
}
function menuAction(m){
  if(m==='file'){
    document.querySelectorAll('.menu-item').forEach(function(el){el.classList.remove('active');});
    event.target.classList.add('active');
    setTimeout(function(){event.target.classList.remove('active');},500);
  }
}

buildPalette();buildSteps();activateStep('pencil');
</script>
</body>
</html>
