<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Matnli Hujjat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1e;color:#e2e8f0;font-family:'Inter',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
canvas#bg{position:fixed;inset:0;z-index:0}
.ui{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;padding:12px 14px}

.hdr{text-align:center;margin-bottom:10px}
.hdr-badge{font-size:8px;color:#3b82f655;letter-spacing:4px}
.hdr h1{font-size:1.3rem;font-weight:800;color:#fff;text-shadow:0 0 24px #3b82f644}
.hdr p{font-size:.75rem;color:#475569}

/* Steps bar */
.steps-bar{display:flex;gap:4px;margin-bottom:10px;justify-content:center;flex-wrap:wrap}
.stp{padding:5px 12px;border-radius:20px;border:1px solid #1e3a5a;font-size:.72rem;
  color:#475569;cursor:pointer;transition:all .2s}
.stp.active{background:rgba(59,130,246,.15);border-color:#3b82f6;color:#60a5fa;font-weight:700}
.stp.done{background:rgba(59,130,246,.08);border-color:#3b82f655;color:#3b82f6}

/* Main */
.main{flex:1;display:grid;grid-template-columns:1.2fr 1fr;gap:10px;min-height:0}

/* Word simulation */
.word-panel{background:rgba(5,10,25,.88);border:1px solid #1e3a5a;border-radius:14px;
  overflow:hidden;display:flex;flex-direction:column}
.word-title{font-size:8px;color:#3b82f6;letter-spacing:3px;padding:10px 14px 6px;font-weight:700}

/* Word UI */
.word-chrome{flex:1;display:flex;flex-direction:column;margin:0 10px 10px;
  border-radius:10px;overflow:hidden;border:1px solid #1e3a5a}
.word-titlebar{background:#1e3560;padding:5px 10px;display:flex;align-items:center;gap:8px}
.word-titlebar-dots{display:flex;gap:4px}
.word-titlebar-dot{width:8px;height:8px;border-radius:50%}
.word-filename{flex:1;text-align:center;font-size:.72rem;color:#94a3b8;font-family:'JetBrains Mono',monospace}
.word-ribbon{background:#1a3080;padding:6px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ribbon-btn{padding:3px 8px;border-radius:4px;border:1px solid #2a4090;font-size:.65rem;
  color:#93c5fd;cursor:pointer;transition:all .2s;background:transparent}
.ribbon-btn:hover{background:rgba(59,130,246,.2);border-color:#3b82f6}
.ribbon-btn.active-btn{background:rgba(59,130,246,.3);border-color:#60a5fa;color:#fff}
.word-body{flex:1;background:#fff;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
.word-line{height:10px;border-radius:3px;background:#f1f5f9;transition:all .5s}
.word-line.typed{background:#1e293b}
.word-line.typed.short{width:60%}
.word-line.typed.med{width:85%}
.word-line.typed.full{width:100%}
.word-line.selected{background:#3b82f688!important}
.word-cursor{display:inline-block;width:2px;height:14px;background:#1e293b;
  animation:blink .8s infinite;vertical-align:middle;margin-left:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.word-status{background:#1a3080;padding:3px 10px;font-size:.62rem;color:#60a5fa;
  font-family:'JetBrains Mono',monospace;display:flex;gap:12px}

/* Right panel */
.right{display:flex;flex-direction:column;gap:8px;min-height:0}

/* Info panel */
.info-panel{background:rgba(5,10,25,.88);border:1px solid #1e3a5a;border-radius:14px;padding:12px;flex:1}
.info-title{font-size:8px;color:#3b82f6;letter-spacing:3px;margin-bottom:10px;font-weight:700}
.info-content{display:flex;flex-direction:column;gap:6px}
.info-step{display:flex;gap:8px;padding:8px 10px;border-radius:9px;
  background:rgba(10,20,50,.6);border:1px solid #1e3a5a;
  opacity:.3;transition:all .4s}
.info-step.show{opacity:1;animation:slideIn .4s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.is-icon{font-size:1.2rem;flex-shrink:0}
.is-body{flex:1}
.is-title{font-size:.78rem;font-weight:700;color:#e2e8f0;margin-bottom:2px}
.is-desc{font-size:.68rem;color:#64748b;line-height:1.4}

/* Keys panel */
.keys-panel{background:rgba(5,10,25,.88);border:1px solid #1e3a5a;border-radius:14px;padding:12px}
.keys-title{font-size:8px;color:#3b82f6;letter-spacing:3px;margin-bottom:8px;font-weight:700}
.keys-row{display:flex;gap:6px;flex-wrap:wrap}
.key{padding:5px 10px;border-radius:6px;border:1.5px solid #1e3a5a;
  font-family:'JetBrains Mono',monospace;font-size:.72rem;color:#64748b;
  background:rgba(10,20,50,.6);transition:all .3s}
.key.press{border-color:#3b82f6;color:#60a5fa;background:rgba(59,130,246,.15);
  box-shadow:0 0 12px rgba(59,130,246,.3);transform:scale(.95)}

/* Nav */
.nav-row{display:flex;gap:8px;justify-content:center;margin-top:6px}
.nav-btn{padding:9px 20px;border-radius:10px;border:1.5px solid #1e3a5a;
  background:transparent;color:#64748b;font-size:.82rem;cursor:pointer;
  font-family:'Inter',sans-serif;font-weight:600;transition:all .2s}
.nav-btn.primary{background:rgba(59,130,246,.1);border-color:#3b82f6;color:#60a5fa}
.nav-btn.primary:hover{background:rgba(59,130,246,.2)}
.nav-btn:hover{border-color:#334155;color:#94a3b8}

.dots{display:flex;justify-content:center;gap:6px;margin-top:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#0f1a2a;transition:all .3s}
.dot.done{background:#3b82f6}
.dot.cur{background:#3b82f688;box-shadow:0 0 10px #3b82f6}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="ui">
  <div class="hdr">
    <div class="hdr-badge">&#9679; 5-SINF &middot; 1-CHORAK</div>
    <h1>&#128196; Matnli Hujjat bilan Ishlash</h1>
    <p>Word dasturida hujjat ochish, yozish va saqlash</p>
  </div>

  <div class="steps-bar" id="steps-bar"></div>

  <div class="main">
    <!-- Word simulation -->
    <div class="word-panel">
      <div class="word-title">&#128196; WORD DASTURI &mdash; SIMULATSIYA</div>
      <div class="word-chrome">
        <div class="word-titlebar">
          <div class="word-titlebar-dots">
            <div class="word-titlebar-dot" style="background:#ef4444"></div>
            <div class="word-titlebar-dot" style="background:#f59e0b"></div>
            <div class="word-titlebar-dot" style="background:#22c55e"></div>
          </div>
          <div class="word-filename" id="word-filename">Yangi hujjat — Microsoft Word</div>
        </div>
        <div class="word-ribbon" id="word-ribbon">
          <span class="ribbon-btn" id="rb-file">&#128196; Fayl</span>
          <span class="ribbon-btn" id="rb-home">Bosh sahifa</span>
          <span class="ribbon-btn" id="rb-insert">Qo'shish</span>
          <span class="ribbon-btn" id="rb-bold">&#66;</span>
          <span class="ribbon-btn" id="rb-italic"><i>I</i></span>
          <span class="ribbon-btn" id="rb-save">&#128190; Saqlash</span>
        </div>
        <div class="word-body" id="word-body">
          <div style="display:flex;align-items:center;height:14px">
            <span id="cursor" class="word-cursor" style="display:none"></span>
          </div>
          <div class="word-line" id="l1"></div>
          <div class="word-line" id="l2"></div>
          <div class="word-line" id="l3"></div>
          <div class="word-line" id="l4"></div>
          <div class="word-line" id="l5"></div>
          <div class="word-line" id="l6"></div>
        </div>
        <div class="word-status">
          <span id="st-words">So'zlar: 0</span>
          <span id="st-page">Sahifa: 1/1</span>
          <span id="st-lang">UZB</span>
        </div>
      </div>
    </div>

    <!-- Right -->
    <div class="right">
      <div class="info-panel">
        <div class="info-title">&#9889; BOSQICHLAR</div>
        <div class="info-content" id="info-content"></div>
      </div>
      <div class="keys-panel">
        <div class="keys-title">&#9109; KLAVIATURA TUGMALARI</div>
        <div class="keys-row" id="keys-row">
          <div class="key" id="k-ctrl">Ctrl</div>
          <div class="key" id="k-s">S</div>
          <div class="key" id="k-n">N</div>
          <div class="key" id="k-a">A</div>
          <div class="key" id="k-c">C</div>
          <div class="key" id="k-v">V</div>
          <div class="key" id="k-z">Z</div>
          <div class="key" id="k-p">P</div>
        </div>
      </div>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prev-btn" onclick="prevStep()">&#8592; Oldingi</button>
    <button class="nav-btn primary" id="next-btn" onclick="nextStep()">Keyingi &#8594;</button>
  </div>
  <div class="dots" id="dots"></div>
</div>

<script>
// ── Background ──────────────────────────────────────────────────────────────
var bgc=document.getElementById('bg');
var bx=bgc.getContext('2d');
var bPts=[];
function rBg(){bgc.width=innerWidth;bgc.height=innerHeight;}
rBg();window.addEventListener('resize',rBg);
for(var i=0;i<45;i++) bPts.push({x:Math.random()*1400,y:Math.random()*900,vx:(Math.random()-.5)*.1,vy:(Math.random()-.5)*.1});
(function ab(){
  requestAnimationFrame(ab);
  bx.clearRect(0,0,bgc.width,bgc.height);
  bPts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=bgc.width;if(p.x>bgc.width)p.x=0;
    if(p.y<0)p.y=bgc.height;if(p.y>bgc.height)p.y=0;});
  for(var i=0;i<bPts.length;i++) for(var j=i+1;j<bPts.length;j++){
    var d=Math.hypot(bPts[i].x-bPts[j].x,bPts[i].y-bPts[j].y);
    if(d<100){bx.beginPath();bx.moveTo(bPts[i].x,bPts[i].y);bx.lineTo(bPts[j].x,bPts[j].y);
      bx.strokeStyle='rgba(59,130,246,'+(0.025*(1-d/100))+')';bx.stroke();}}
  bPts.forEach(function(p){bx.beginPath();bx.arc(p.x,p.y,1.2,0,Math.PI*2);
    bx.fillStyle='rgba(59,130,246,.13)';bx.fill();});
})();

// ── Steps data ──────────────────────────────────────────────────────────────
var STEPS=[
  {label:'1. Ochish',
   info:{icon:'&#128196;',title:'Word ni ochish',desc:'Start menyusidan Microsoft Word ni topib bosing. Yoki ish stolida W belgisiga ikki marta bosing.'},
   keys:[], ribbon:'rb-file',
   animate:function(){
     document.getElementById('word-filename').textContent='Yangi hujjat 1 — Microsoft Word';
     document.getElementById('cursor').style.display='inline-block';
     document.getElementById('st-words').textContent='So\'zlar: 0';
   }},
  {label:'2. Yozish',
   info:{icon:'&#9000;',title:'Matn yozish',desc:'Klaviatura yordamida matn terish. Kursor yozish joyini ko\'rsatadi. Har bir tugma bosish — ekranda harf paydo bo\'ladi.'},
   keys:['k-ctrl'],
   animate:function(){
     var lines=['l1','l2','l3','l4','l5'];
     var cls=['full','med','full','short','med'];
     lines.forEach(function(id,i){
       setTimeout(function(lid,lc){return function(){
         var el=document.getElementById(lid);
         el.classList.add('typed',lc);
       };}(id,cls[i]),i*300);
     });
     setTimeout(function(){document.getElementById('st-words').textContent='So\'zlar: 47';},1600);
   }},
  {label:'3. Belgilash',
   info:{icon:'&#128161;',title:'Matnni belgilash',desc:'Ctrl+A — hammasini belgilash. Yoki sichqoncha bilan sudrab belgilang. Belgilangan matn ko\'k rangda ko\'rinadi.'},
   keys:['k-ctrl','k-a'],
   ribbon:'rb-home',
   animate:function(){
     ['l1','l2','l3','l4','l5'].forEach(function(id){
       var el=document.getElementById(id);
       el.classList.add('selected');
     });
     pressKey('k-ctrl');pressKey('k-a');
   }},
  {label:'4. Formatlash',
   info:{icon:'&#66;',title:'Matnni formatlash',desc:'Belgilangan matnni qalin (Bold), kursiv (Italic) yoki boshqa uslubda formatlash mumkin. Ctrl+B — qalin yozuv.'},
   keys:['k-ctrl','k-s'],
   ribbon:'rb-bold',
   animate:function(){
     ['l1','l2','l3','l4','l5'].forEach(function(id){
       var el=document.getElementById(id);
       el.classList.remove('selected');
       el.style.height='12px';
     });
     document.getElementById('rb-bold').classList.add('active-btn');
     pressKey('k-ctrl');pressKey('k-s');
   }},
  {label:'5. Saqlash',
   info:{icon:'&#128190;',title:'Hujjatni saqlash',desc:'Ctrl+S — hujjatni saqlash. Birinchi saqlashda fayl nomi va joy tanlanadi. Keyin har saqlashda avtomatik yangilanadi.'},
   keys:['k-ctrl','k-s'],
   ribbon:'rb-save',
   animate:function(){
     document.getElementById('rb-bold').classList.remove('active-btn');
     document.getElementById('rb-save').classList.add('active-btn');
     document.getElementById('word-filename').textContent='darsim.docx — Microsoft Word';
     pressKey('k-ctrl');pressKey('k-s');
     setTimeout(function(){
       document.getElementById('rb-save').classList.remove('active-btn');
     },1000);
   }},
];

var cur=0;

function pressKey(id){
  var el=document.getElementById(id);
  if(!el)return;
  el.classList.add('press');
  setTimeout(function(){el.classList.remove('press');},500);
}

function buildStepsBar(){
  var bar=document.getElementById('steps-bar');bar.innerHTML='';
  STEPS.forEach(function(s,i){
    var d=document.createElement('div');
    d.className='stp'+(i<cur?' done':i===cur?' active':'');
    d.textContent=s.label;
    d.onclick=function(){goTo(i);};
    bar.appendChild(d);
  });
}

function buildDots(){
  var d=document.getElementById('dots');d.innerHTML='';
  STEPS.forEach(function(_,i){
    var dot=document.createElement('div');
    dot.className='dot'+(i<cur?' done':i===cur?' cur':'');
    d.appendChild(dot);
  });
}

function buildInfo(s){
  var c=document.getElementById('info-content');c.innerHTML='';
  var d=document.createElement('div');d.className='info-step show';
  d.innerHTML='<div class="is-icon">'+s.info.icon+'</div>'
    +'<div class="is-body"><div class="is-title">'+s.info.title+'</div>'
    +'<div class="is-desc">'+s.info.desc+'</div></div>';
  c.appendChild(d);

  // Tips
  var tips=[
    {icon:'&#128161;',title:'Eslab qoling',desc:'Ctrl+Z — oxirgi amalni bekor qilish. Xato qilsangiz shu tugmani bosing!'},
    {icon:'&#128196;',title:'Fayl kengaytmasi',desc:'.docx — Word fayli. .pdf — barcha qurilmada bir xil ko\'rinadi.'},
  ];
  tips.forEach(function(t,i){
    setTimeout(function(){
      var d2=document.createElement('div');d2.className='info-step show';
      d2.innerHTML='<div class="is-icon">'+t.icon+'</div>'
        +'<div class="is-body"><div class="is-title">'+t.title+'</div>'
        +'<div class="is-desc">'+t.desc+'</div></div>';
      c.appendChild(d2);
    },(i+1)*400);
  });
}

function resetLines(){
  ['l1','l2','l3','l4','l5','l6'].forEach(function(id){
    var el=document.getElementById(id);
    el.className='word-line';el.style.height='';el.style.width='';
  });
}

function goTo(i){
  cur=i;
  resetLines();
  ['rb-file','rb-home','rb-insert','rb-bold','rb-italic','rb-save'].forEach(function(id){
    document.getElementById(id).classList.remove('active-btn');
  });
  var s=STEPS[cur];
  if(s.ribbon) document.getElementById(s.ribbon).classList.add('active-btn');
  s.animate();
  buildInfo(s);
  buildStepsBar();
  buildDots();
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').textContent=cur===STEPS.length-1?'&#10003; Tugadi':'Keyingi &#8594;';
}

function nextStep(){if(cur<STEPS.length-1)goTo(cur+1);}
function prevStep(){if(cur>0)goTo(cur-1);}

goTo(0);
</script>
</body>
</html>
