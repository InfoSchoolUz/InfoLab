name: Papka strukturasini yaratish

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 7 sinf x 4 chorak = 28 papka + fayllar yaratish
        run: |
          python3 << 'EOF'
          import os

          sinflar  = ['05-sinf','06-sinf','07-sinf','08-sinf','09-sinf','10-sinf','11-sinf']
          choraklar = [
            ('1-chorak','1-chorak','Sentyabr — Oktyabr'),
            ('2-chorak','2-chorak','Noyabr — Dekabr'),
            ('3-chorak','3-chorak','Yanvar — Mart'),
            ('4-chorak','4-chorak','Aprel — May'),
          ]
          colors = {
            '05-sinf':'#3b82f6','06-sinf':'#10b981','07-sinf':'#f59e0b',
            '08-sinf':'#ef4444','09-sinf':'#a855f7','10-sinf':'#06b6d4','11-sinf':'#f97316'
          }

          HTML_TEMPLATE = '''<!DOCTYPE html>
          <html lang="uz">
          <head>
          <meta charset="UTF-8"/>
          <meta name="viewport" content="width=device-width,initial-scale=1"/>
          <title>Tez orada</title>
          <style>
          *{{margin:0;padding:0;box-sizing:border-box}}
          body{{background:#000510;color:#e2e8f0;font-family:sans-serif;
            height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}}
          .icon{{font-size:4rem}}
          h1{{font-size:1.4rem;color:#fff;text-align:center}}
          p{{color:#475569;font-size:.9rem;text-align:center}}
          .badge{{background:{color}22;border:1px solid {color}44;color:{color};
            border-radius:20px;padding:6px 18px;font-size:.8rem;font-weight:700;margin-top:8px}}
          </style>
          </head>
          <body>
          <div class="icon">&#128198;</div>
          <h1>{sinf} &mdash; {chorak}</h1>
          <p>Bu bo\'lim uchun ko\'rgazma tez orada qo\'shiladi</p>
          <div class="badge">Azamat Madrimov &mdash; InfoSchoolUz</div>
          </body>
          </html>'''

          JSON_TEMPLATE = '''{{\n  "title": "Tez orada",\n  "description": "{sinf} {chorak} uchun ko\'rgazma",\n  "icon": "&#128198;",\n  "color": "{color}",\n  "sinf": "{sinf}"\n}}'''

          for sinf in sinflar:
            col = colors[sinf]
            sinf_label = sinf.replace('0','').replace('-sinf',' sinf')
            for ch_folder, ch_label, ch_months in choraklar:
              path = os.path.join('korgazmalar', sinf, ch_folder, '00-tez-orada')
              os.makedirs(path, exist_ok=True)

              html = HTML_TEMPLATE.format(sinf=sinf_label, chorak=ch_label, color=col)
              with open(os.path.join(path,'index.html'),'w',encoding='utf-8') as f:
                f.write(html)

              meta = JSON_TEMPLATE.format(sinf=sinf_label, color=col)
              with open(os.path.join(path,'meta.json'),'w',encoding='utf-8') as f:
                f.write(meta)

          print("Hammasi yaratildi!")
          EOF

      - name: GitHub ga yuklash
        run: |
          git config user.email "azamat@infoschoool.uz"
          git config user.name "Azamat Madrimov"
          git add .
          git commit -m "28 ta papka yaratildi - InfoLab struktura"
          git push
